services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-jbdh_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ArianAAA123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    networks:
      - jbdh_network
    command: postgres -c password_encryption=md5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_redis
    volumes:
      - redis_data:/data
    networks:
      - jbdh_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env.docker
    networks:
      - jbdh_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../JBDH-frontend/myapp-frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_frontend
    networks:
      - jbdh_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

  etl:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_etl
    command:
      - sh
      - -c
      - |
        while true; do
          echo "Starting ETL batch..."
          python manage.py shell -c "from apps.jobs.services.etl_pipeline_service import ETLPipelineService; ETLPipelineService.run_pipeline_batched(1000)"
          echo "Waiting 30s before next batch..."
          sleep 30
        done
    volumes:
      - .:/app
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    env_file:
      - .env.docker
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - jbdh_network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  minilm:
    build:
      context: .
      dockerfile: Dockerfile.minilm
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_minilm
    networks:
      - jbdh_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minilm:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ats:
    build:
      context: .
      dockerfile: Dockerfile.ats
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_ats
    networks:
      - jbdh_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ats:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:




  jbdh_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  pgadmin_data:
