services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jbdh_postgres
    environment:
      POSTGRES_DB: jbdh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ArianAAA123
    ports:
      - "127.0.0.1:5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jbdh_network
    command: postgres -c password_encryption=md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jbdh_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jbdh_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: jbdh_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    networks:
      - jbdh_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../JBDH-frontend/myapp-frontend
      dockerfile: Dockerfile
    container_name: jbdh_frontend
    ports:
      - "3000:80"
    networks:
      - jbdh_network
    depends_on:
      - backend

  etl:
    build: .
    container_name: jbdh_etl
    command:
      - sh
      - -c
      - |
        while true; do
          echo "🚀 Starting ETL batch..."
          python manage.py shell -c "from apps.jobs.services.etl_pipeline_service import ETLPipelineService; ETLPipelineService.run_pipeline_batched(1000)"
          echo "⏳ Waiting 30s before next batch..."
          sleep 30
        done
    volumes:
      - .:/app
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - jbdh_network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

networks:




  jbdh_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
