name: Deploy Azure Function

on:
  push:
    paths:
      - 'JBDH-Functions/**'
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' # eller 8.0.x om du använder .NET 8

    - name: Restore dependencies
      run: dotnet restore JBDH-Functions/JBDH-Functions.csproj

    - name: Build
      run: dotnet build JBDH-Functions/JBDH-Functions.csproj --configuration Release

    - name: Publish
      run: dotnet publish JBDH-Functions/JBDH-Functions.csproj --configuration Release --output ./publish

    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: jbdh-job-snapshot # Ditt Azure Function App-namn
        package: ./publish
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}