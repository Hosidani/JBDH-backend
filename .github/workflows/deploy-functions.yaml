name: Deploy Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'JBDH-Functions/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore JBDH-Functions/JBDH-Functions.csproj

      - name: Build
        run: dotnet build JBDH-Functions/JBDH-Functions.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish JBDH-Functions/JBDH-Functions.csproj -c Release -o JBDH-Functions/publish

      - name: Zip publish folder
        run: |
          cd JBDH-Functions/publish
          zip -r ../functionapp.zip .
          cd ../..

      - name: Deploy to Azure Functions
        uses: azure/webapps-deploy@v2
        with:
          app-name: jbdh-job-snapshot
          package: JBDH-Functions/functionapp.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}