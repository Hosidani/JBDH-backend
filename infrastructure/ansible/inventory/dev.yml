---
# Dev runs on the SAME physical server as staging and prod.
# Separate Docker project + separate directory keeps them isolated.

all:
  children:
    dev:
      hosts:
        app-server:
          ansible_host: "89.167.117.88"
          ansible_user: root
          ansible_ssh_extra_args: "-o ForwardAgent=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ansible_python_interpreter: /usr/bin/python3
