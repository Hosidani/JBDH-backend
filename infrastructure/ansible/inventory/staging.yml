---
# Ansible inventory for the staging environment.
# Both staging and prod run on the SAME physical server.
# Update ansible_host after running: terraform output server_ip

all:
  children:
    staging:
      hosts:
        app-server:
          ansible_host: "89.167.117.88"   # your current server IP
          ansible_user: root               # change to 'deploy' after first Ansible provision
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
          ansible_python_interpreter: /usr/bin/python3
