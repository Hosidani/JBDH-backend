---
# roles/common/tasks/main.yml
# Runs once when provisioning a fresh server.
# Idempotent — safe to re-run.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - fail2ban
      - unattended-upgrades
      - python3-pip
      - python3-docker   # needed for Ansible docker_* modules
    state: present
  become: true

- name: Configure UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Configure UFW — allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  become: true

- name: Configure UFW — allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny   # default deny inbound
  become: true

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  become: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  become: true

- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  become: true
