---
# roles/app/tasks/main.yml
# Pulls latest code and (re)starts the Docker Compose stack.
# This role is called on EVERY deployment — not just initial setup.

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  become: true

- name: Mark repo dir as safe for git (ownership mismatch between runs)
  ansible.builtin.command:
    cmd: git config --global --add safe.directory {{ item }}
  loop:
    - "{{ deploy_dir }}/repo"
    - "{{ deploy_dir }}/JBDH-frontend"
  become: true
  
- name: Clone or pull latest backend code
  ansible.builtin.git:
    repo: "{{ git_repo }}"
    dest: "{{ deploy_dir }}/repo"
    version: "{{ git_branch }}"
    force: true
    accept_hostkey: true
    depth: 1
    key_file: /root/.ssh/id_ed25519
  become: true 
  # Run as root so it can use the forwarded SSH agent

- name: Clone or pull latest frontend code
  ansible.builtin.git:
    repo: "git@github.com:Hosidani/JBDH-frontend.git"
    dest: "{{ deploy_dir }}/JBDH-frontend"
    version: main
    force: true
    depth: 1
    accept_hostkey: true
    key_file: /root/.ssh/id_ed25519_frontend
  become: true

- name: Set ownership of deploy dir to deploy user
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    recurse: true
    state: directory
  become: true

- name: Copy .env file to server (from GitHub Secrets via CI)
  # The CI pipeline passes the env file content via -e "env_file_content=..."
  # We write it to two places:
  #   1. .env.docker  — required by the base docker-compose.yml env_file: entry
  #   2. .env.<env>   — required by the override compose file (docker-compose.dev.yml etc.)
  ansible.builtin.copy:
    content: "{{ env_file_content }}"
    dest: "{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  loop:
    - "{{ deploy_dir }}/repo/.env.docker"
    - "{{ deploy_dir }}/repo/{{ compose_env_filename }}"
  become: true
  no_log: true

- name: Build and restart Docker Compose stack
  ansible.builtin.command:
    cmd: >
      docker compose
      --project-name {{ compose_project_name }}
      --env-file {{ deploy_dir }}/repo/.env.docker
      -f {{ deploy_dir }}/repo/docker-compose.yml
      -f {{ deploy_dir }}/repo/{{ compose_override_file }}
      up -d --build --remove-orphans
  become: true
  register: compose_result
  async: 1800
  poll: 30

- name: Show compose output
  ansible.builtin.debug:
    var: compose_result.stdout_lines

# --- Database initialisation (idempotent) -----------------------------------

- name: Wait for postgres to be ready
  ansible.builtin.command:
    cmd: docker exec {{ compose_project_name }}_postgres pg_isready -U {{ db_user }}
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  become: true
  changed_when: false

- name: Check if database exists
  ansible.builtin.command:
    cmd: >
      docker exec {{ compose_project_name }}_postgres
      psql -U {{ db_user }} -tAc
      "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'"
  register: db_exists
  become: true
  changed_when: false

- name: Create database
  ansible.builtin.command:
    cmd: >
      docker exec {{ compose_project_name }}_postgres
      psql -U {{ db_user }} -c "CREATE DATABASE {{ db_name }};"
  become: true
  when: db_exists.stdout.strip() != "1"

- name: Create pgvector extension
  ansible.builtin.command:
    cmd: >
      docker exec {{ compose_project_name }}_postgres
      psql -U {{ db_user }} -d {{ db_name }}
      -c "CREATE EXTENSION IF NOT EXISTS vector;"
  become: true
  changed_when: false

# --- Migrations & static files -----------------------------------------------

- name: Run Django migrations
  ansible.builtin.command:
    cmd: >
      docker compose
      --project-name {{ compose_project_name }}
      --env-file {{ deploy_dir }}/repo/.env.docker
      -f {{ deploy_dir }}/repo/docker-compose.yml
      -f {{ deploy_dir }}/repo/{{ compose_override_file }}
      exec -T backend python manage.py migrate --noinput
  become: true

- name: Collect static files
  ansible.builtin.command:
    cmd: >
      docker compose
      --project-name {{ compose_project_name }}
      --env-file {{ deploy_dir }}/repo/.env.docker
      -f {{ deploy_dir }}/repo/docker-compose.yml
      -f {{ deploy_dir }}/repo/{{ compose_override_file }}
      exec -T backend python manage.py collectstatic --noinput
  become: true
