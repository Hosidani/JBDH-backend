services:
  postgres:
    command: postgres -c password_encryption=md5
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    build: .
    image: jbdh-app-base:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
    networks:
      - jbdh_network
      - jbdh_shared
    restart: unless-stopped

  frontend:
    build:
      args:
        VITE_MODE: production
        # Leave VITE_API_URL empty to use .env.production
    environment:
      - PGADMIN_HOST=${COMPOSE_PROJECT_NAME}_pgadmin_prod
    ports:
      - "3000:80"
    restart: unless-stopped

  etl:
    image: jbdh-app-base:latest
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          echo "Starting ETL batch..."
          python manage.py shell -c "from apps.jobs.services.etl_pipeline_service import ETLPipelineService; ETLPipelineService.run_pipeline_batched(1000)"
          echo "Waiting 30s before next batch..."
          sleep 30
        done
    mem_limit: 2g
    cpus: 1.0
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
    networks:
      - jbdh_network
      - jbdh_shared
    restart: unless-stopped

  ats:
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin_prod
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jbdh.se
      PGADMIN_DEFAULT_PASSWORD: jbdh2026!
      SCRIPT_NAME: /admin
    expose:
      - "80"
    #ports:                       # uncomment if nginx is down and you want direct access to pgadmin
    #- "8080:80"
    networks:
      - jbdh_network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

networks:
  jbdh_shared:
    name: jbdh_shared
    external: true
