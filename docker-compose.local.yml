services:
  postgres:


  redis:
    ports:
      - "6379:6379"

  backend:
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development

  frontend:
    build:
      args:
        VITE_MODE: development
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"

  etl:
    command:
      - sh
      - -c
      - |
        while true; do
          echo "🚀 Starting ETL batch..."
          python manage.py shell -c "from apps.jobs.services.etl_pipeline_service import ETLPipelineService; ETLPipelineService.run_pipeline_batched(1000)"
          echo "⏳ Waiting 30s before next batch..."
          sleep 30
        done
    volumes:
      - .:/app
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    env_file:
      - .env.local

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jbdh_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: jbdh2026!
    ports:
      - "8080:80"
    networks:
      - jbdh_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
