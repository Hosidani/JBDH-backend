services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minilm:
    build:
      context: .
      dockerfile: Dockerfile.minilm
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_minilm
    ports:
      - "8500:8000"
    networks:
      - jbdh_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      minilm:
        condition: service_healthy

  frontend:
    build:
      args:
        VITE_MODE: development
    environment:
      - PGADMIN_HOST=${COMPOSE_PROJECT_NAME:-jbdh}_pgadmin
    ports:
      - "3000:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME:-jbdh}_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: jbdh2026!
    ports:
      - "8080:80"
    networks:
      - jbdh_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  etl:
    command:
      - sh
      - -c
      - |
        while true; do
          echo "🚀 Starting ETL batch..."
          python manage.py shell -c "from apps.jobs.services.etl_pipeline_service import ETLPipelineService; ETLPipelineService.run_pipeline_batched(1000)"
          echo "⏳ Waiting 30s before next batch..."
          sleep 30
        done
    volumes:
      - .:/app
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    env_file:
      - .env.local
